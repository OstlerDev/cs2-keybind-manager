[package]
name = "cs2-keybind-manager"
version = "0.1.0"
edition = "2021"
description = "Cycle through multiple pages of CS2 chat-key binds with one toggle key."
repository = "https://github.com/ostlerdev/cs2-keybind-manager"
license = "MIT OR Apache-2.0"
readme = "README.md"
rust-version = "1.80"

[dependencies]
eframe = { version = "0.34", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.34"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.17"
directories = "6.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
insta = { version = "1.47", features = ["yaml"] }
tempfile = "3.27"
ttf-parser = "0.25.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
